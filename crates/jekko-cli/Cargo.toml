[package]
name = "jekko-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "jekko"
path = "src/main.rs"

[lib]
name = "jekko_cli"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
jekko-core = { path = "../jekko-core" }
jekko-jnoccio-boot = { path = "../jekko-jnoccio-boot" }
jekko-provider = { path = "../jekko-provider" }
jekko-runtime = { path = "../jekko-runtime" }
jekko-server = { path = "../jekko-server" }
jekko-plugin-api = { path = "../jekko-plugin-api" }
jekko-store = { path = "../jekko-store" }
jekko-tui = { path = "../jekko-tui" }
jekko-runner = { path = "../jekko-runner" }
crossterm = "0.28"
notify = "6"
ratatui = { version = "0.28", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zyal-supervisor = { path = "../zyal-supervisor" }
zyalc = { path = "../zyalc" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
