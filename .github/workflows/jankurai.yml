name: jankurai

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jankurai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Jankurai security lane
        run: bash ops/ci/security.sh
      - name: Run jankurai audit
        run: bash ops/ci/jankurai.sh
      - name: jankurai audit gate
        run: cargo run -p xtask --locked -- jankurai-gate --score .jankurai/repo-score.json
      - name: Check README badge (PR / non-main)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: bash ops/ci/jankurai-badge.sh --check
      - name: Check README badge (main)
        if: (success() || failure()) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          bash ops/ci/jankurai-badge.sh
          if git diff --quiet -- README.md agent/jankurai-badge.svg agent/jankurai-badge.json; then
            echo "Badge artifacts already up-to-date; nothing to commit."
            exit 0
          fi
          echo "Badge artifacts changed; update them on a PR branch instead of pushing to main from CI."
          git diff -- README.md agent/jankurai-badge.svg agent/jankurai-badge.json
          exit 1
      - name: Stage governance artifacts
        run: bash ops/ci/jankurai-stage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: jankurai-adoption-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            .jankurai/jankurai.sarif
            .jankurai/summary.md
            .jankurai/repair-queue.jsonl
            .jankurai/copy-code.json
            .jankurai/copy-code.md
            .jankurai/proof-plan.json
            .jankurai/proof-plan.md
            .jankurai/language-bad-behavior.json
            .jankurai/language-bad-behavior.md
            .jankurai/ux-qa.json
            .jankurai/proofbind/obligations.json
            .jankurai/proofbind/surface-witness.json
            .jankurai/proofbind/proofbind.md
            .jankurai/proof-receipts/**
            .jankurai/proofmark/proofmark-receipt.json
            .jankurai/proofmark/proof-receipt.json
            .jankurai/rust/witness-graph.json
            .jankurai/security/evidence.json
            .jankurai/security/gitleaks.json
            .jankurai/security/cargo-audit.json
            .jankurai/security/zizmor.json
            .jankurai/security/sbom.spdx.json
            .jankurai/security/lane-status.txt
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          sarif_file: .jankurai/jankurai.sarif

  sandbox-backends:
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: bubblewrap
            install: sudo apt-get update && sudo apt-get install -y bubblewrap
          - os: ubuntu-latest
            backend: docker
            install: "true"
          - os: macos-latest
            backend: worktree
            install: "true"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Run sandboxctl matrix lane
        env:
          SANDBOXCTL_BACKEND: ${{ matrix.backend }}
          INSTALL_CMD: ${{ matrix.install }}
        run: bash ops/ci/sandbox-backends.sh
