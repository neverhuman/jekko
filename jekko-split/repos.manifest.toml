# Jekko split-family manifest.
#
# This is the canonical Jeryu-compatible manifest for the public portal plus
# supporting split-family repos. The split root is a directory of independent
# Git repositories, not a Cargo workspace.

schema_version = "1.2.0"
workers = 40
split_root = "/home/ubuntu/jekko-split"
family = "jekko-split"
repo_family = "jekko-split"
umbrella_repo = "jekko"
import_branch_source = "import/source-20260610"
import_branch_dirty = "import/dirty-20260610"
onboarding_gates = ["remote-wired", "ci-skeleton", "jankurai-1.6.1", "audit-clean"]
rollout_wave_order = [0, 1, 2, 3]

required_repos = [
  "jekko",
  "jekko-core",
  "jekko-mcp",
  "jekko-deploy",
  "jekko-jnoccio",
  "jekko-jailgun",
  "jekko-zyal",
  "jekko-search",
  "jekko-memory",
  "jekko-agent",
]

[[repo]]
